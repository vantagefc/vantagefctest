const CHAIN=[-1,1,3,5,7,9];
function holderPos(k,T){if(k<0||CHAIN[k]<0){const c=capEnt(T);return {x:c.x,y:c.y};}const s=SL[ORD[CHAIN[k]]];return {x:s[0],y:s[1]};}
function trophyAt(T){
  const capHold=()=>{const c=capEnt(T);return {x:c.x,y:c.y,z:T>=17.4?42:22};};
  if(T<10.6)return{x:214,y:236,z:26};
  if(T<11.7){const u=ez(seg(T,10.6,11.7)),c=capEnt(T);return{x:lerp(214,c.x,u),y:236,z:lerp(26,22,u)+Math.sin(u*PI)*10};}
  if(T<19.2)return capHold();
  const k=Math.floor((T-19.2)/.75),u=((T-19.2)%.75)/.75;
  if(k<5){const a=holderPos(k,T),b=holderPos(k+1,T);
    if(u<.6)return{x:a.x,y:a.y,z:42+Math.round(Math.sin(T*8)*2)};
    const f=ez((u-.6)/.4);return{x:lerp(a.x,b.x,f),y:lerp(a.y,b.y,f),z:42+Math.sin(f*PI)*16};}
  if(T<23.0){const a=holderPos(5,T);return{x:a.x,y:a.y,z:42};}
  const a=holderPos(5,T),b=holderPos(0,T),f=ez(seg(T,23.0,23.7));
  return{x:lerp(a.x,b.x,f),y:lerp(a.y,b.y,f),z:42+Math.sin(f*PI)*16};
}
/* ---- particles, shake, flashes ---- */
let parts=[],SX=0,SY=0,camName='';
function cannons(){const cs=TR[ti].col.concat(['#ffe45e','#ff5d73']);for(const [x,d] of [[278,1],[552,-1]])for(let i=0;i<70;i++)parts.push({x:x,y:200,vx:d*rnd(10,90),vy:-rnd(150,270),g:150,life:rnd(1.6,3),c:cs[i%cs.length],w:2});}
const EV=[[17.5,cannons],[19.2,cannons],[23.7,cannons]],KICKS=[[10.9,2],[17.55,6],[19.2,4],[23.7,4]],FLASH=[17.55,19.2,23.7];
/* ---- drawing ---- */
function drawList(list,sc0){
  list.sort((a,b)=>(a.gy!==undefined?a.gy:a.y)-(b.gy!==undefined?b.gy:b.y));
  for(const e of list){
    if(e.fn){e.fn();continue;}
    const sc=e.sc||sc0,s=spr(e.a,e.pose,e.kk),w=s.width*sc,h=s.height*sc,z=(e.z||0)*sc/3,u=sc/3;
    ctx.fillStyle='rgba(0,0,0,.3)';ctx.fillRect(Math.round(e.x-w*.4),Math.round(e.y-u/2),Math.round(w*.8),Math.round(u*1.3));
    ctx.save();ctx.translate(Math.round(e.x),Math.round(e.y-z));
    if(e.flip)ctx.scale(-1,1);
    ctx.drawImage(s,-w/2,-h,w,h);
    if(e.medal){ctx.fillStyle='#120e18';ctx.fillRect(Math.round(-2.5*u),Math.round(-29*u),Math.round(5*u),Math.round(7*u));ctx.fillStyle='#ffd84a';ctx.fillRect(Math.round(-1.5*u),Math.round(-27*u),Math.round(3*u),Math.round(4*u));ctx.fillStyle='#d83a3a';ctx.fillRect(Math.round(-.5*u),Math.round(-29*u),Math.round(1*u),Math.round(2*u));}
    ctx.restore();
  }
}
function fireworks(T){
  const col=TR[ti].col,t0=17.4,n=Math.floor((T-t0)/.9);if(T<t0)return;
  for(let id=Math.max(0,n-2);id<=n;id++){
    const e=(T-t0-id*.9)/1.6;if(e<0||e>=1)continue;
    const px=290+((id*137)%260),py=22+((id*47)%40),c=col[id%col.length];
    ctx.fillStyle=hex(c,(.1*(1-e)).toFixed(3));ctx.beginPath();ctx.arc(px,py,30+e*20,0,TAU);ctx.fill();
    for(let k=0;k<28;k++){const a=k/28*TAU;for(const q of [1,.6]){ctx.fillStyle=c;ctx.globalAlpha=(1-e)*q;ctx.fillRect(Math.round(px+Math.cos(a)*e*40*q),Math.round(py+Math.sin(a)*e*40*q+e*e*24),2,2);}}
    ctx.globalAlpha=1;
  }
}
function world(T,cx,cy,z,name){
  camName=name;cx=Math.round(cx);cy=Math.round(cy);
  ctx.setTransform(z,0,0,z,-cx*z+SX,-cy*z+SY);ctx.drawImage(bgW,0,0);
  const up=T>17.5;
  for(const f of FANS){if(f.x<cx-20||f.x>cx+W/z+20)continue;const j=Math.round(Math.abs(Math.sin(T*8+f.ph))*(up?4:1)),s=spr(f.a,up&&Math.sin(T*8+f.ph)>-.3?'Fu':'Fd','h');ctx.drawImage(s,Math.round(f.x-s.width),f.y-s.height*2-j,s.width*2,s.height*2);}
  txt(ctx,KITS[kit].t,411,170,'#ffe45e',2,'c','#000');
  ctx.save();ctx.beginPath();ctx.rect(264,60,294,146);ctx.clip();ctx.globalCompositeOperation='lighter';
  const bx=262+((T*70)%420)-60;ctx.fillStyle='rgba(255,255,255,.07)';ctx.beginPath();ctx.moveTo(bx,60);ctx.lineTo(bx+26,60);ctx.lineTo(bx-30,206);ctx.lineTo(bx-56,206);ctx.fill();ctx.restore();
  ctx.globalCompositeOperation='lighter';
  [290,350,410,470,530].forEach((x,i)=>{const sw=Math.sin(T*1.3+i)*14;ctx.fillStyle='rgba(255,246,208,'+(T>17.4?.07:.045)+')';ctx.beginPath();ctx.moveTo(x-4,54);ctx.lineTo(x+4,54);ctx.lineTo(x+sw+34,208);ctx.lineTo(x+sw-34,208);ctx.fill();});
  ctx.globalCompositeOperation='source-over';
  fireworks(T);
  const L=[];
  for(let i=0;i<10;i++){const e=playerEnt(i,T);if(e)L.push(e);}
  const c=capEnt(T);if(c)L.push(c);L.push(presEnt(T));
  const tp=trophyAt(T),tc=TR[ti].col[0];
  L.push({gy:tp.y+2,fn(){const bx2=tp.x,by=tp.y-tp.z;glow(bx2,by-18,34,tc,.5);trophyDraw(TR[ti].spr,3,bx2,by,T,true);sparkles(bx2,by-18,26,T,6);}});
  drawList(L,3);
  for(const q of parts){ctx.fillStyle=q.c;ctx.fillRect(Math.round(q.x),Math.round(q.y),q.w,q.w);}
  ctx.setTransform(1,0,0,1,0,0);
}
function conf(s,t0,n){
  const cs=TR[ti].col.concat(['#ffe45e','#ff5d73']);
  for(let k=0;k<n;k++){const side=k&1,age=s-t0-(k%9)*.02;if(age<0)continue;
    const x=(side?W+10:-10)+(side?-1:1)*(50+((k*37)%120))*age,y=H+10-((260+((k*53)%170))*age-130*age*age);
    if(y>H+8||y<-30)continue;ctx.fillStyle=cs[k%cs.length];ctx.fillRect(Math.round(x),Math.round(y),2,3);}
}
function lift(T){
  const s=T-15.7,t=TR[ti];camName='THE LIFT';
  ctx.setTransform(1,0,0,1,SX,SY);ctx.drawImage(bgL,0,0);
  ctx.globalCompositeOperation='lighter';
  [60,180,300,420].forEach((x,i)=>{ctx.fillStyle='rgba(255,246,208,.06)';ctx.beginPath();ctx.moveTo(x-6,0);ctx.lineTo(x+6,0);ctx.lineTo(240+(x-240)*.5+Math.sin(T*1.5+i)*30+50,196);ctx.lineTo(240+(x-240)*.5+Math.sin(T*1.5+i)*30-50,196);ctx.fill();});
  ctx.globalCompositeOperation='source-over';
  const cheer=s>1.85,clap=Math.floor(s*4)&1,L=[];
  [[70,200],[130,196],[190,200],[290,200],[350,196],[410,200],[100,186],[160,182],[320,182],[380,186]].forEach((p,i)=>L.push({a:APP[i],kk:'h',x:p[0],y:p[1],pose:cheer?'Auu0':(clap?'Aff0':'Add0'),sc:3,medal:true,z:cheer?Math.round(Math.abs(Math.sin(s*8+i))*10):0}));
  const sc=s<1.2?6:s<2.4?7:8,up=ez(seg(s,.8,1.8)),cy=276;
  L.push({a:CAPA,kk:'h',x:240,y:cy,pose:s<1.3?'Abb0':'Auu0',sc:sc,medal:true,z:cheer?Math.round(Math.abs(Math.sin(s*5))*3):0});
  drawList(L,3);
  const zt=lerp(22,42,up),ty=cy-zt*sc/3,tx=240;
  glow(tx,ty-sc*7,60+up*30,t.col[0],.55);
  if(s>1.85){const p=Math.sin((s-1.85)*3)*.5+.5;glow(tx,ty-sc*7,100,t.col[2],.2*p);}
  trophyDraw(t.spr,sc,tx,ty,T,true);sparkles(tx,ty-sc*6,sc*9,T,10);
  if(s>1.85)conf(s,1.85,100);
  if(s>2.0){const bl=Math.floor(s*6)&1;ctx.fillStyle='rgba(0,0,0,.4)';ctx.fillRect(0,14,W,34);txt(ctx,'CHAMPIONS!',240,20,bl?t.col[0]:'#ffffff',5,'c','#000');}
  ctx.fillStyle='#000';ctx.fillRect(0,0,W,10);ctx.fillRect(0,260,W,10);
}
function card(T){
  const tl=T-27,t=TR[ti],K=KITS[kit];camName='CHAMPIONS';
  ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#04060c';ctx.fillRect(0,0,W,H);
  for(let i=0;i<14;i++){ctx.fillStyle=hex(t.col[0],(.03).toFixed(2));ctx.beginPath();const a=i/14*TAU+tl*.15;ctx.moveTo(240,160);ctx.lineTo(240+Math.cos(a)*400,160+Math.sin(a)*400);ctx.lineTo(240+Math.cos(a+.12)*400,160+Math.sin(a+.12)*400);ctx.fill();}
  glow(240,150,110,t.col[0],.5);
  const bob=Math.round(Math.sin(tl*2)*3);
  trophyDraw(t.spr,7,240,206+bob,T,true);sparkles(240,150,70,T,14);
  const sh=((tl*140)%760)-140;
  txt(ctx,'CHAMPIONS',240,18,t.col[0],6,'c','#000');
  ctx.save();ctx.beginPath();ctx.rect(sh,10,26,40);ctx.clip();txt(ctx,'CHAMPIONS',240,18,'#ffffff',6,'c');ctx.restore();
  txt(ctx,t.n,240,58,'#ffffff',3,'c','#000');
  txt(ctx,K.t,240,222,'#ffe45e',3,'c','#000');txt(ctx,'SEASON 2026',240,250,'#cfe8d6',1,'c');
  ctx.fillStyle=K.s;ctx.fillRect(0,262,W,8);
  conf(tl,0,120);
  const a=seg(tl,2.6,3.4);if(a>0){ctx.fillStyle='rgba(0,0,0,'+(.0).toFixed(2)+')';}
}
/* ---- shots ---- */
const SHOTS=[{n:'WIDE',a:0,b:3.5},{n:'MEDALS',a:3.5,b:9.5},{n:'HANDOVER',a:9.5,b:12},{n:'THE WALK',a:12,b:15.7},{n:'THE LIFT',a:15.7,b:19.2},{n:'CELEBRATION',a:19.2,b:23.7},{n:'FIREWORKS',a:23.7,b:27},{n:'CHAMPIONS',a:27,b:31}];
const MSG=['THE CEREMONY BEGINS','MEDALS FOR THE CHAMPIONS','THE CAPTAIN RECEIVES THE TROPHY','UP THE STEPS TO THE STAGE','','THE TEAM CELEBRATES','FIREWORKS OVER THE STADIUM',''];
const END=32.4,LAST=31;
let T=0,lastShot=-1,fl=0,auto=false,fired={};
const shotAt=t=>{for(let i=0;i<SHOTS.length;i++)if(t<SHOTS[i].b)return i;return SHOTS.length-1;};
function reset(){T=0;parts=[];fired={};lastShot=-1;}
function pick(i){ti=(i+TR.length)%TR.length;buildBG();reset();}
function overlay(t,si){
  const home=KITS[kit],tr=TR[ti];
  ctx.fillStyle='rgba(8,14,12,.82)';ctx.fillRect(96,3,288,17);ctx.fillStyle=home.s;ctx.fillRect(96,3,5,17);ctx.fillStyle=tr.col[0];ctx.fillRect(379,3,5,17);
  txt(ctx,tr.n,240,5,'#fff',1,'c');txt(ctx,home.t+' - CHAMPIONS',240,12,'#ffe45e',1,'c');
  ctx.fillStyle='rgba(8,14,12,.82)';ctx.fillRect(4,3,86,14);txt(ctx,camName,8,6,'#ffe45e',1);
  const msg=MSG[si];if(msg){ctx.fillStyle='rgba(8,14,12,.82)';ctx.fillRect(4,236,msg.length*4+14,13);ctx.fillStyle=home.s;ctx.fillRect(4,236,4,13);txt(ctx,msg,13,240,'#fff',1);}
  ctx.fillStyle='rgba(255,255,255,.2)';ctx.fillRect(0,266,W,4);ctx.fillStyle='#ffe45e';ctx.fillRect(0,266,Math.round(clamp(t/LAST,0,1)*W),4);
  ctx.fillStyle='#000';for(const s of SHOTS)ctx.fillRect(Math.round(s.a/LAST*W),266,1,4);
  TR.forEach((q,i)=>{const x=24+i*22;ctx.fillStyle=i===ti?'#ffe45e':'rgba(8,14,12,.8)';ctx.fillRect(x,252,18,10);txt(ctx,i+1,x+9,255,i===ti?'#10201a':'#cfe8d6',1,'c');});
  txt(ctx,auto?'AUTO':'LOOP',230,256,'#8fb7a0',1);
  if(fl>.02){ctx.fillStyle='rgba(255,255,255,'+(fl*.6).toFixed(2)+')';ctx.fillRect(0,0,W,H);}
}
let last=0;
function frame(now){
  requestAnimationFrame(frame);
  const dt=Math.min(.05,(now-(last||now))/1000);last=now;T+=dt;
  if(T>END){if(auto)pick(ti+1);else reset();return;}
  const t=Math.min(T,LAST),si=shotAt(T);
  EV.forEach((e,k)=>{if(t>=e[0]&&!fired[k]){fired[k]=1;e[1]();}});
  for(const q of parts){q.life-=dt;q.x+=q.vx*dt;q.y+=q.vy*dt;q.vy+=q.g*dt;}
  parts=parts.filter(q=>q.life>0);
  let a=0;for(const k of KICKS)if(t>=k[0])a+=k[1]*Math.exp(-(t-k[0])*8);
  SX=Math.round(Math.sin(t*70)*a);SY=Math.round(Math.cos(t*63)*a);
  let f2=0;for(const f of FLASH)if(t>=f)f2=Math.max(f2,Math.exp(-(t-f)*7));fl=f2;
  ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
  if(si===0)world(t,lerp(150,130,ez(seg(t,0,3.5))),0,1,'WIDE');
  else if(si===1)world(t,lerp(80,190,ez(seg(t,3.5,9.5))),112,2,'MEDALS');
  else if(si===2)world(t,110,160,3,'HANDOVER');
  else if(si===3){const c=capEnt(t);world(t,clamp((c?c.x:200)-110,100,400),118,2,'THE WALK');}
  else if(si===4)lift(t);
  else if(si===5)t<21.2?world(t,300,100,2,'CELEBRATION'):world(t,160,0,1,'CELEBRATION WIDE');
  else if(si===6)world(t,lerp(160,120,seg(t,23.7,27)),0,1,'FIREWORKS');
  else card(t);
  ctx.setTransform(1,0,0,1,0,0);
  ctx.strokeStyle='rgba(0,0,0,.09)';for(let k=0;k<5;k++)ctx.strokeRect(k+.5,k+.5,W-2*k-1,H-2*k-1);
  if(si===6){const tt=TR[ti];txt(ctx,'CHAMPIONS',240,44,Math.floor(t*4)&1?tt.col[0]:'#fff',6,'c','#000');}
  overlay(t,si);
}
function fit(){const a=document.getElementById('app'),k=Math.min(a.clientWidth/W,a.clientHeight/H);cv.style.width=Math.floor(W*k)+'px';cv.style.height=Math.floor(H*k)+'px';}
addEventListener('resize',fit);fit();
addEventListener('keydown',e=>{
  if(e.code==='ArrowRight'||e.code==='KeyD')pick(ti+1);
  else if(e.code==='ArrowLeft'||e.code==='KeyA')pick(ti-1);
  else if(e.code==='ArrowUp'||e.code==='ArrowDown'){kit=(kit+(e.code==='ArrowUp'?1:7))%8;e.preventDefault();}
  else if(e.code==='Space'||e.code==='Enter'){reset();e.preventDefault();}
  else if(e.code==='KeyP')auto=!auto;
  else if(/^Digit[1-9]$/.test(e.code))pick(+e.code[5]-1);
  else if(e.code==='Comma'){const i=shotAt(T);T=SHOTS[Math.max(0,T-SHOTS[i].a>.6?i:i-1)].a;}
  else if(e.code==='Period'){T=SHOTS[Math.min(SHOTS.length-1,shotAt(T)+1)].a;}
});
cv.addEventListener('pointerdown',e=>{
  const r=cv.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*W,y=(e.clientY-r.top)/r.height*H;
  if(y>250&&x>=24&&x<24+TR.length*22){pick(Math.floor((x-24)/22));return;}
  if(y>250&&x>220&&x<270){auto=!auto;return;}
  if(x<150)pick(ti-1);else if(x>330)pick(ti+1);else reset();
});
pick(0);requestAnimationFrame(frame);
})();
</script>
